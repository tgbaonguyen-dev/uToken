name: utoken_mobile
description: μToken — dashboard hiệu suất sử dụng token
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Phiên bản dưới đây là mốc tối thiểu; chạy `flutter pub upgrade --major-versions` khi khởi tạo.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  fl_chart: ^0.69.0
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^18.0.0
  http: ^1.2.2
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
